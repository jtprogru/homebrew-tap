<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="jtprogru/tap — Homebrew tap with personal CLI utilities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#484f58"/>
      <stop offset="0.35" stop-color="#8b949e"/>
      <stop offset="1" stop-color="#3d444d"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="900" cy="200" r="320" fill="url(#glow)"/>

  <!-- faucet -->
  <rect x="980" y="0" width="26" height="130" rx="6" fill="url(#steel)"/>
  <rect x="961" y="42" width="64" height="13" rx="6.5" fill="#6e7681"/>
  <rect x="880" y="104" width="126" height="26" rx="13" fill="url(#steel)"/>
  <rect x="880" y="118" width="26" height="52" rx="9" fill="url(#steel)"/>
  <rect x="874" y="160" width="38" height="12" rx="6" fill="#6e7681"/>

  <!-- drops -->
  <path d="M893 171 C 901 183 902 187 902 191 A 9 9 0 1 1 884 191 C 884 187 885 183 893 171 Z" fill="url(#drop)"/>
  <circle cx="893" cy="206" r="5" fill="#f5a623" opacity="0.55"/>

  <!-- terminal -->
  <rect x="690" y="216" width="430" height="112" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="714" cy="240" r="5" fill="#ff5f57"/>
  <circle cx="734" cy="240" r="5" fill="#febc2e"/>
  <circle cx="754" cy="240" r="5" fill="#28c840"/>
  <line x1="690" y1="260" x2="1120" y2="260" stroke="#30363d" stroke-width="1.5"/>
  <text x="714" y="286" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9"><tspan fill="#f5a623">$</tspan> brew tap jtprogru/tap</text>
  <text x="714" y="312" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9"><tspan fill="#f5a623">$</tspan> brew install --cask srekit</text>
  <rect x="972" y="300" width="9" height="16" rx="1" fill="#ffb454" opacity="0.85"/>

  <!-- wordmark -->
  <rect x="80" y="108" width="34" height="4" rx="2" fill="#f5a623"/>
  <text x="126" y="118" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4" fill="#ffb454">HOMEBREW TAP</text>
  <text x="80" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f0f6fc">jtprogru/tap</text>
  <text x="80" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#8b949e">Personal CLI utilities — formulae and casks</text>
</svg>
